<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'">
  <title>Altair Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar">
    <span class="drag"></span>
    <button id="btn-min" class="wbtn" title="Minimize">&#8211;</button>
    <button id="btn-close" class="wbtn close" title="Cerrar">&#10005;</button>
  </div>

  <aside class="side">
    <img src="logo.png" class="logo" alt="Altair Client">
    <nav>
      <button class="nav active" data-page="play">Play</button>
      <button class="nav" data-page="settings">Settings</button>
      <button class="nav" data-page="log">Log</button>
    </nav>
    <div class="account" id="account">
      <div class="who" id="who">Not signed in</div>
      <button id="btn-login" class="ghost">Sign in with Microsoft</button>
      <button id="btn-offline" class="link">Play offline (no account)</button>
      <button id="btn-logout" class="link hidden">Sign out</button>
    </div>
  </aside>

  <main>
    <section id="page-play" class="page">
      <img src="emblem.png" class="emblem" alt="">
      <h1>Altair Client</h1>
      <p class="sub">Pick a Minecraft version. The launcher installs Java, Forge and the client for you.</p>

      <div class="row">
        <label for="version">Version</label>
        <select id="version"></select>
        <span id="installed" class="badge"></span>
      </div>

      <button id="btn-play" class="play">PLAY</button>

      <div class="progress hidden" id="progress"><div class="bar" id="bar"></div></div>
      <div class="status" id="status">Ready.</div>
      <div class="notice" id="notice"></div>
    </section>

    <section id="page-settings" class="page hidden">
      <h2>Settings</h2>
      <div class="grid">
        <label>Memory (MB)
          <input id="set-ram" type="number" min="1024" max="32768" step="512">
        </label>
        <label>Resolution
          <span class="inline"><input id="set-w" type="number" min="640"> &times; <input id="set-h" type="number" min="480"></span>
        </label>
        <label class="check"><input id="set-full" type="checkbox"> Fullscreen</label>
        <label>Game folder (empty = default)
          <span class="inline"><input id="set-dir" type="text" readonly><button id="btn-dir" class="ghost small">Browse...</button><button id="btn-dir-clear" class="ghost small">Reset</button></span>
        </label>
        <label>Custom Java (empty = automatic)
          <input id="set-java" type="text" placeholder="C:\Program Files\Java\...\bin\java.exe">
        </label>
        <label>Offline name
          <input id="set-offline" type="text" maxlength="16">
        </label>
        <label class="wide">JVM arguments
          <input id="set-jvm" type="text" spellcheck="false">
        </label>
      </div>
      <div class="row">
        <button id="btn-save" class="ghost">Save</button>
        <button id="btn-open" class="ghost">Open launcher folder</button>
        <span id="saved" class="badge"></span>
      </div>
    </section>

    <section id="page-log" class="page hidden">
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
