<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'">
  <title>Altair Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div><div class="stars s2"></div>
  <div class="titlebar">
    <span class="drag"></span>
    <button id="btn-min" class="wbtn" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
    <button id="btn-close" class="wbtn close" title="Close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8"/></svg></button>
  </div>

  <aside class="side">
    <div class="brand">
      <img src="mark.webp" width="44" height="44" alt="">
      <div><b>ALTAIR</b><small>LAUNCHER</small></div>
    </div>
    <nav>
      <button class="nav active" data-page="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Play</button>
      <button class="nav" data-page="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
      <button class="nav" data-page="log"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Log</button>
    </nav>
    <div class="account">
      <div class="who-row">
        <div class="avatar" id="avatar">?</div>
        <div class="who" id="who">Not signed in</div>
      </div>
      <button id="btn-login" class="ghost wide-btn">Sign in with Microsoft</button>
      <button id="btn-offline" class="link">Play offline (no account)</button>
      <button id="btn-logout" class="link hidden">Sign out</button>
    </div>
  </aside>

  <main>
    <section id="page-play" class="page">
      <div class="play-center">
        <button id="btn-version" class="vbtn" aria-haspopup="dialog">
          <span class="vlabel">VERSION</span>
          <span class="vname" id="vname">1.21.1</span>
          <svg viewBox="0 0 10 6"><path d="M1 1l4 4 4-4"/></svg>
        </button>
        <div class="hero"><img src="hero.webp" alt="Altair Client" width="420" height="420"></div>
        <div id="vinfo" class="vinfo"></div>
        <button id="btn-play" class="play"><span id="play-label">PLAY</span></button>
        <div class="progress hidden" id="progress"><div class="bar" id="bar"></div></div>
        <div class="status" id="status">Ready.</div>
        <div class="notice" id="notice"></div>
      </div>
    </section>

    <section id="page-settings" class="page hidden">
      <h2>Settings</h2>
      <div class="card">
        <div class="field">
          <label for="set-ram">Memory <b id="ram-out">4 GB</b></label>
          <input id="set-ram" type="range" min="1024" max="16384" step="512">
          <div class="hint" id="ram-hint"></div>
        </div>
        <div class="two">
          <div class="field">
            <label>Resolution</label>
            <span class="inline"><input id="set-w" type="number" min="640"> <i>&times;</i> <input id="set-h" type="number" min="480"></span>
          </div>
          <div class="field">
            <label>&nbsp;</label>
            <label class="check"><input id="set-full" type="checkbox"> Fullscreen</label>
          </div>
        </div>
        <div class="field">
          <label>Game folder <span class="hint">(empty = default)</span></label>
          <span class="inline"><input id="set-dir" type="text" readonly><button id="btn-dir" class="ghost small">Browse...</button><button id="btn-dir-clear" class="ghost small">Reset</button></span>
        </div>
        <div class="field">
          <label>Custom Java <span class="hint">(empty = automatic)</span></label>
          <input id="set-java" type="text" placeholder="C:\Program Files\Java\...\bin\java.exe">
        </div>
        <div class="two">
          <div class="field">
            <label>Offline name</label>
            <input id="set-offline" type="text" maxlength="16">
          </div>
          <div class="field">
            <label>JVM arguments</label>
            <input id="set-jvm" type="text" spellcheck="false">
          </div>
        </div>
        <div class="row">
          <button id="btn-save" class="primary">Save</button>
          <button id="btn-open" class="ghost">Open launcher folder</button>
          <span id="saved" class="badge"></span>
        </div>
      </div>
    </section>

    <section id="page-log" class="page hidden">
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Select version">
    <div class="sheet">
      <div class="sheet-head">
        <h3>Select version</h3>
        <button id="modal-close" class="wbtn x" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8"/></svg></button>
      </div>
      <div id="versions" class="versions"></div>
      <div class="legend"><i></i> Installed &nbsp;&middot;&nbsp; others download on first play</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
