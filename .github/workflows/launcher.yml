name: Build Launcher

on:
  push:
    branches: [launcher]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check font files
        run: |
          ls node_modules/@fontsource/pixelify-sans/files | grep -E 'latin-(400|700)-normal.woff2'
          test -f node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-400-normal.woff2
          test -f node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-700-normal.woff2
      - name: Syntax check
        run: |
          for f in main.js preload.js renderer/app.js lib/*.js; do node --check "$f"; done
      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List output
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: altair-launcher
          path: |
            launcher/dist/*.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="launcher-v${version}"
          gh release create "$tag" dist/*.exe --title "Altair Launcher ${version}" --notes "Launcher de Windows para Altair Client. Instalador (Setup) y versión portable." --target "${GITHUB_SHA}" \
            || gh release upload "$tag" dist/*.exe --clobber
