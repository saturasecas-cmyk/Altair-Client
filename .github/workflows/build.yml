name: Build Forge Mod

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build --no-daemon --stacktrace

    - name: Verify JAR contents
      run: |
        jar=$(ls build/libs/*.jar | head -n1)
        echo "JAR: $jar"
        unzip -l "$jar" | tee /tmp/jar.txt
        grep -q "META-INF/mods.toml" /tmp/jar.txt
        grep -q "com/altairclient/AltairClient.class" /tmp/jar.txt
        grep -q "altairclient.mixins.json" /tmp/jar.txt
        unzip -p "$jar" META-INF/MANIFEST.MF | tee /tmp/manifest.txt
        grep -q "MixinConfigs: altairclient.mixins.json" /tmp/manifest.txt

    - name: Upload mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: altairclient-forge-26.1
        path: build/libs/*.jar
        if-no-files-found: error

    - name: Publish release (solo en main)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/port/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        jar=$(ls build/libs/*.jar | head -n1)
        version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
        mcv="${GITHUB_REF_NAME#port/}"
        tag="v${version}-${mcv}"
        gh release delete "$tag" --cleanup-tag --yes || true
        gh release create "$tag" "$jar" \
          --target "$GITHUB_SHA" \
          --title "Altair Client ${version} (Forge ${mcv})" \
          --notes "Port a Forge ${mcv} (${GITHUB_SHA::7}). Sin probar en el juego. Descarga el .jar y ponlo en la carpeta mods de Forge ${mcv}."
