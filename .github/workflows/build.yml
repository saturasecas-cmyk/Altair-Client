name: Build Forge Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build --no-daemon --stacktrace

    - name: Verify JAR contents
      run: |
        jar=$(ls build/libs/*.jar | head -n1)
        echo "JAR: $jar"
        unzip -l "$jar" | tee /tmp/jar.txt
        grep -q "META-INF/mods.toml" /tmp/jar.txt
        grep -q "altairclient.mixins.json" /tmp/jar.txt
        grep -q "com/altairclient/AltairClient.class" /tmp/jar.txt

    - name: Upload mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: altairclient-forge-26.2
        path: build/libs/*.jar
        if-no-files-found: error
