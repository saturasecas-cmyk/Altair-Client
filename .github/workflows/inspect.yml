name: Inspect Fix
on:
  push:
    branches: ['inspect/fix']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        CJ=$(echo "$JARS" | tr ':' '\n' | grep client-extra | head -1)
        d() { echo "::group::$1"; javap -p -cp "$CP" $1 2>&1 | grep -v "static final" | cut -c1-220 | head -${2:-120}; echo "::endgroup::"; }
        for c in $(cat inspect-classes.txt); do d $c 150; done
        echo "::group::class search"; unzip -l "$CJ" | grep -iE "Panorama|Fog|ItemInHand|Crosshair|FluidRender|LiquidBlock|ScreenEffect|BreakingBlock|CrackParticle|DestroyBlock|BlockDestruction|TotemParticle|SwordItem" | awk '{print $4}' | head -60; echo "::endgroup::"
