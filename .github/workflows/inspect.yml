name: Inspect PvP

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        CJ=$(echo "$JARS" | grep client-extra | head -1)
        unzip -Z1 "$CJ" > /tmp/all.txt
        echo "::group::screens"; unzip -Z1 "$CJ" | grep -E 'net/minecraft/client/gui/screens/.*(Loading|Progress|Receiving|Connect|Generic|Download|Level).*\.class' | grep -v '\$' | head -30; unzip -Z1 "$CJ" | grep -E 'client/gui/screens/LoadingOverlay|client/gui/screens/Overlay|Overlay.class' | head; echo "::endgroup::"
        for c in net.minecraft.client.gui.screens.LevelLoadingScreen net.minecraft.client.gui.screens.LoadingOverlay net.minecraft.client.gui.screens.ProgressScreen net.minecraft.client.gui.screens.ReceivingLevelScreen; do echo "::group::$c"; javap -p -cp "$CP" $c 2>&1 | cut -c1-230; echo "::endgroup::"; done
        echo "::group::loading overlay code"; javap -p -c -cp "$CP" net.minecraft.client.gui.screens.LoadingOverlay 2>&1 | grep -E 'extractRenderState|getfield|putfield|invoke.*(setOverlay|clearColor|fill|blit)' | head -50 | cut -c1-200; echo "::endgroup::"
