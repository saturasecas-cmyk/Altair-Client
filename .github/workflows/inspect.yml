name: Inspect API

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JAR=$GITHUB_WORKSPACE/.gradle/mavenizer/repo/net/minecraftforge/forge/26.2-65.1.6/forge-26.2-65.1.6.jar
        dump() { echo "::group::$1"; javap -p -cp "$JAR" "$1" 2>&1 | head -${2:-200}; echo "::endgroup::"; }
        mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$JAR" 'net/minecraft/client/*' 'net/minecraftforge/*' || true
        echo "::group::classes referencing ViewportEvent ComputeFov"
        grep -rl 'ViewportEvent$ComputeFov' /tmp/x | head
        echo "::endgroup::"
        dump net.minecraftforge.client.event.AddGuiOverlayLayersEvent 40
        dump net.minecraft.client.gui.Hud 80
        echo "::group::Layer iface"
        for c in net.minecraft.client.gui.LayeredDraw 'net.minecraft.client.gui.LayeredDraw$Layer' net.minecraftforge.client.gui.overlay.ForgeLayerInstance; do javap -p -cp "$JAR" "$c" 2>&1 | head -40; done
        echo "::endgroup::"
        echo "::group::mixin related in forge jar"
        unzip -l "$JAR" | grep -i -E 'mixin' | head -20
        echo "::endgroup::"
        echo "::group::TickEvent ClientTickEvent"
        javap -p -cp "$JAR" 'net.minecraftforge.event.TickEvent$ClientTickEvent$Post' 2>&1 | head -20
        echo "::endgroup::"
