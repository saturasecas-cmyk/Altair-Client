name: Inspect API 3

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        SRC=$(find $GITHUB_WORKSPACE/.gradle -name 'forge-26.2-*-sources.jar' | head -1)
        JAR=$(find $GITHUB_WORKSPACE/.gradle -name 'forge-26.2-*.jar' ! -name '*sources*' | head -1)
        mkdir -p /tmp/src && cd /tmp/src && unzip -q -o "$SRC" 'net/minecraftforge/client/event/*'
        echo "::group::events list"; ls net/minecraftforge/client/event | tr '\n' ' '; echo "::endgroup::"
        d() { echo "::group::$1 ($2)"; javap -p -cp "$JAR" "$1" 2>&1 | grep -i -E "$2" | head -${3:-25}; echo "::endgroup::"; }
        d net.minecraft.client.renderer.OrderedSubmitNodeCollector "ShapeOutline|CustomGeometry|Line" 10
        echo "::group::ClockInstance"; javap -p -cp "$JAR" 'net.minecraft.client.ClientClockManager$ClockInstance'; echo "::endgroup::"
        echo "::group::ClockNetworkState"; javap -p -cp "$JAR" net.minecraft.world.clock.ClockNetworkState; echo "::endgroup::"
        d net.minecraft.world.clock.WorldClock "." 10
        d net.minecraft.world.clock.WorldClocks "." 10
        d net.minecraft.world.level.dimension.DimensionType "clock|Clock|fixedTime" 10
        d net.minecraft.world.level.Level "dimensionType|clock|Clock" 10
        d net.minecraft.client.multiplayer.ClientLevel "ClientLevelData|getDayTime|clock" 10
        echo "::group::submitBlockOutline"; javap -p -c -cp "$JAR" net.minecraft.client.renderer.LevelRenderer | grep -A70 "void submitBlockOutline" | grep -E "invoke|getfield|getstatic" | cut -c1-260 | head -40; echo "::endgroup::"
