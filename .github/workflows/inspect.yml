name: Inspect PvP

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        CJ=$(echo "$JARS" | grep client-extra | head -1)
        unzip -Z1 "$CJ" > /tmp/all.txt
        FJ=$(echo "$JARS" | grep -E 'forge-26.2' | head -1)
        unzip -Z1 "$CJ" | grep -i -E 'renderer/(SkyRenderer|LevelRenderer|state/.*Sky)|attribute/(EnvironmentAttribute|Environment)|ClientLevel|dimension/DimensionType|clock' | head -40
        echo "::group::sky classes"; unzip -Z1 "$CJ" | grep -E 'net/minecraft/client/renderer/(Sky|state/level/Sky)|net/minecraft/world/attribute/' | head -60; echo "::endgroup::"
        echo "::group::SkyRenderer"; javap -p -cp "$CP" net.minecraft.client.renderer.SkyRenderer 2>&1 | cut -c1-260; echo "::endgroup::"
        echo "::group::SkyRenderState"; javap -p -cp "$CP" net.minecraft.client.renderer.state.level.SkyRenderState 2>&1 | cut -c1-200; echo "::endgroup::"
        echo "::group::EnvAttrs"; javap -p -cp "$CP" net.minecraft.world.attribute.EnvironmentAttributes 2>&1 | grep -i -E 'sky|star|fog|cloud|sun|moon' | cut -c1-200; echo "::endgroup::"
        echo "::group::forge level events"; unzip -Z1 "$FJ" | grep -E 'client/event/(RenderLevel|ViewportEvent|ComputeFog|RenderSky|CloudEvent|Sky)' | head -20; echo "::endgroup::"
        echo "::group::viewport"; javap -p -cp "$CP" 'net.minecraftforge.client.event.ViewportEvent$ComputeFogColor' 2>&1 | grep public; echo "::endgroup::"
        echo "::group::stage"; javap -p -cp "$CP" 'net.minecraftforge.client.event.RenderLevelStageEvent' 2>&1 | head -30; unzip -Z1 "$FJ" | grep -E 'RenderLevelStageEvent' ; echo "::endgroup::"
        echo "::group::bg env attr"; javap -p -cp "$CP" net.minecraft.client.renderer.LevelRenderer 2>&1 | grep -i -E 'sky|star' | cut -c1-220; javap -p -cp "$CP" net.minecraft.client.renderer.fog.FogRenderer 2>&1 | head -30 | cut -c1-200; echo "::endgroup::"
