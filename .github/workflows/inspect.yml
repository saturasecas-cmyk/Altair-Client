name: Inspect Beta

on:
  push:
    branches: ['inspect/beta']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        j() { echo "::group::$1 $2"; javap -p -cp "$CP" $1 2>&1 | grep -iE "$2" | cut -c1-230; echo "::endgroup::"; }
        j net.minecraft.client.gui.Gui "rosshair|CameraOverlay|umpkin|Overlay|Spyglass|extractRender|extractHotbar"
        j net.minecraft.client.gui.screens.TitleScreen "extract|Panorama|Background|render|init|fade"
        j net.minecraft.client.gui.screens.Screen "Panorama|Background|Blur|extractRenderState"
        j net.minecraft.client.renderer.PanoramaRenderer "."
        j net.minecraft.client.renderer.ItemBlockRenderTypes "."
        j net.minecraft.client.Options "nimat|ipmap|Cloud|ambient|entityShadows|particles\(|renderDistance|simulation|maxFps|fps|vsync|biomeBlend|graphicsPreset|improved"
        j net.minecraft.client.renderer.ScreenEffectRenderer "."
        j net.minecraftforge.client.gui.overlay.ForgeLayeredDraw "static final"
        j net.minecraft.client.renderer.texture.SpriteContents "tick|Animat|class|uploadFirst"
        j net.minecraft.client.renderer.texture.TextureAtlas "tick|Animat|cycle"
        j net.minecraft.client.renderer.texture.TextureAtlasSprite "tick|Animat|cycle"
