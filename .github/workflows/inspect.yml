name: Inspect Hacks
on:
  push:
    branches: ['inspect/hacks']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons|minecraft|mojang' )
        CP=$(echo "$JARS" | tr '\n' ':')
        echo "::group::classes"
        for j in $JARS; do unzip -l $j 2>/dev/null | awk '{print $4}' | grep -E '\.class$' | grep -E 'renderer/fog/|Tags\.class|ItemTags|BlockTags|world/item/BlockItem|CropBlock.class' | head -30; done | sort -u
        echo "::endgroup::"
        d() { echo "::group::$1"; javap -p -cp "$CP" $1 2>&1 | grep -E "$2" || true; echo "::endgroup::"; }
        d2() { echo "::group::$1"; javap -p -s -cp "$CP" $1 2>&1 | grep -A1 -E "$2" || true; echo "::endgroup::"; }
        d2() { echo "::group::$1"; javap -p -s -cp "$CP" $1 2>&1 | grep -A1 -E "$2" || true; echo "::endgroup::"; }
        d2 net.minecraft.client.renderer.LevelRenderer 'invalidateCompiledGeometry'
        d net.minecraft.client.Camera 'public ' || true
        d net.minecraft.client.renderer.GameRenderer 'getFov|getProjectionMatrix|getMainCamera|Matrix|fov|Fov' || true
        d 'net.minecraft.client.DeltaTracker$Timer' 'float|long|double|int |advance|tick' || true
        d net.minecraft.client.DeltaTracker 'public ' || true
        d net.minecraft.world.TickRateManager 'public |private ' || true
        d net.minecraft.client.Minecraft 'DeltaTracker|timer|deltaTracker' || true
        d net.minecraft.client.multiplayer.MultiPlayerGameMode 'releaseUsingItem|interact|useItem' || true
        d net.minecraft.client.player.LocalPlayer 'respawn|isUsingItem|setSprinting|input' || true
        d net.minecraft.world.entity.LivingEntity 'isBlocking|getUseItemRemainingTicks|getTicksUsingItem|getUsedItemHand' || true
        d net.minecraft.world.level.block.RespawnAnchorBlock 'CHARGE' || true
        d net.minecraft.world.item.Items 'MACE|COBWEB|RESPAWN_ANCHOR|GLOWSTONE |FLINT_AND_STEEL|SHIELD|SHEARS' || true
        d net.minecraft.world.item.ItemStack 'getDestroySpeed|isCorrectToolForDrops' || true
