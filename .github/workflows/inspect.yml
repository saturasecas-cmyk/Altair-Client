name: Inspect Forge API (temporal)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - uses: gradle/actions/setup-gradle@v4

    - name: Print compile classpath
      run: |
        cat > /tmp/cp.init.gradle <<'EOF'
        allprojects {
          afterEvaluate {
            tasks.register('printCp') {
              doLast {
                configurations.compileClasspath.files.each { println "CP:" + it }
              }
            }
          }
        }
        EOF
        ./gradlew --init-script /tmp/cp.init.gradle printCp -q --no-daemon 2>&1 | grep '^CP:' | sed 's/^CP://' > /tmp/cp.txt || true
        wc -l /tmp/cp.txt
        cat /tmp/cp.txt

    - name: Inspect APIs
      run: |
        CP=$(paste -sd: /tmp/cp.txt)
        echo "=== Gui (hud) ==="
        javap -p -cp "$CP" net.minecraft.client.gui.Gui | grep -iE "hud" || true
        echo "=== Minecraft (hud) ==="
        javap -p -cp "$CP" net.minecraft.client.Minecraft | grep -iE "hud" || true
        echo "=== Hud public API ==="
        javap -p -cp "$CP" net.minecraft.client.gui.Hud | grep -E "^  public" | head -40 || true
        echo "=== pack.mcmeta in jars ==="
        for j in $(cat /tmp/cp.txt); do
          if unzip -l "$j" 2>/dev/null | grep -q "pack.mcmeta"; then
            echo "--- $j"
            unzip -p "$j" pack.mcmeta | head -30
          fi
        done
