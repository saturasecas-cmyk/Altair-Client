name: Inspect Beta

on:
  push:
    branches: ['inspect/beta']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        j() { echo "::group::$1 $2"; javap -p -cp "$CP" $1 2>&1 | grep -iE "$2" | cut -c1-230; echo "::endgroup::"; }
        CJ=$(echo "$JARS" | tr ':' '\n' | grep client-extra | head -1)
        echo "::group::classes"; unzip -l "$CJ" | grep -iE "rosshair|umpkin|HandItem|ItemInHand|FluidRender|LiquidBlockRenderer|ChunkSectionLayer|ItemBlockRender" | awk '{print $4}' | head -40; echo "::endgroup::"
        echo "::group::Gui all"; javap -p -cp "$CP" net.minecraft.client.gui.Gui 2>&1 | cut -c1-200 | head -80; echo "::endgroup::"
        echo "::group::ForgeLayeredDraw methods"; javap -p -cp "$CP" net.minecraftforge.client.gui.overlay.ForgeLayeredDraw 2>&1 | grep -v "static final" | cut -c1-200; echo "::endgroup::"
        echo "::group::ForgeLayerInstance"; javap -p -cp "$CP" net.minecraftforge.client.gui.overlay.ForgeLayerInstance 2>&1 | cut -c1-200; echo "::endgroup::"
