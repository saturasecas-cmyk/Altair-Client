name: Inspect Hacks
on:
  push:
    branches: ['inspect/hacks']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons|minecraft|mojang' )
        CP=$(echo "$JARS" | tr '\n' ':')
        echo "::group::classes"
        for j in $JARS; do unzip -l $j 2>/dev/null | awk '{print $4}' | grep -E '\.class$' | grep -E 'renderer/fog/|Tags\.class|ItemTags|BlockTags|world/item/BlockItem|CropBlock.class' | head -30; done | sort -u
        echo "::endgroup::"
        d() { echo "::group::$1"; javap -p -cp "$CP" $1 2>&1 | grep -E "$2"; echo "::endgroup::"; }
        d net.minecraft.world.level.block.Block 'shouldRenderFace'
        d net.minecraft.world.entity.Entity 'isCurrentlyGlowing|getViewYRot|getViewXRot|getEyePosition|getBoundingBox\(\)'
        d net.minecraft.world.entity.player.Player 'fishing'
        d net.minecraft.client.Minecraft 'rightClickDelay|getDeltaTracker|getWindow|levelRenderer'
        d net.minecraft.client.multiplayer.MultiPlayerGameMode 'destroyDelay|destroyProgress|startDestroyBlock|continueDestroyBlock|isDestroying|useItem\('
        d net.minecraft.client.Options 'bobView|damageTiltStrength|fov\(|screenEffectScale|fovEffectScale'
        d net.minecraft.client.particle.ParticleEngine 'add\(|createParticle'
        d net.minecraft.client.multiplayer.ClientLevel 'setRainLevel|setThunderLevel'
        d net.minecraft.world.level.Level 'setRainLevel|setThunderLevel|dimension\(\)|noCollision'
        d net.minecraft.world.level.block.CropBlock 'isMaxAge|getAge|class '
        d com.mojang.blaze3d.platform.Window 'getGuiScaledWidth|getGuiScaledHeight'
        d net.minecraft.client.gui.GuiGraphicsExtractor 'guiWidth|guiHeight|fill\(|line|text\('
        d net.minecraft.world.entity.projectile.FishingHook 'nibble|biting|hookedIn|getHookedIn|timeUntilHooked|currentState'
        d net.minecraft.world.phys.Vec3 'directionFromRotation'
        d net.minecraftforge.event.RenderLevelStageEvent 'class |Stage'
