name: Inspect Notes

on:
  push:
    branches: ['inspect/notes']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        for c in net.minecraft.client.input.KeyEvent net.minecraft.client.input.CharacterEvent net.minecraft.client.input.InputWithModifiers net.minecraft.client.input.MouseButtonEvent net.minecraft.client.KeyboardHandler net.minecraft.network.chat.Style; do echo "::group::$c"; javap -p -cp "$CP" $c 2>&1 | grep -v "lambda\|static final" | cut -c1-200; echo "::endgroup::"; done
        echo "::group::GuiGraphicsExtractor text/fill"; javap -p -cp "$CP" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | grep -E " (text|fill|textWithBackdrop|centeredText|enableScissor|disableScissor)\(" | cut -c1-220; echo "::endgroup::"
        echo "::group::Font"; javap -p -cp "$CP" net.minecraft.client.gui.Font 2>&1 | grep -E " width\(" | cut -c1-200; echo "::endgroup::"
        echo "::group::Screen"; javap -p -cp "$CP" net.minecraft.client.gui.screens.Screen 2>&1 | grep -E "keyPressed|charTyped|keyReleased|mouseScrolled|extractBackground|extractTransparentBackground|renderBackground|isPauseScreen|shouldCloseOnEsc|onClose|isInGameUi" | cut -c1-200; echo "::endgroup::"
