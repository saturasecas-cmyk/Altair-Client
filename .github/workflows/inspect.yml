name: Inspect API 3

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        SRC=$(find $GITHUB_WORKSPACE/.gradle -name 'forge-26.2-*-sources.jar' | head -1)
        JAR=$(find $GITHUB_WORKSPACE/.gradle -name 'forge-26.2-*.jar' ! -name '*sources*' | head -1)
        mkdir -p /tmp/src && cd /tmp/src && unzip -q -o "$SRC" 'net/minecraftforge/client/event/*'
        echo "::group::events list"; ls net/minecraftforge/client/event | tr '\n' ' '; echo "::endgroup::"
        for c in RenderGuiOverlayEvent; do
          echo "::group::$c"; grep -v -E '^\s*(\*|/\*|//|import|$)' net/minecraftforge/client/event/$c.java | head -70; echo "::endgroup::"
        done
        unzip -q -o "$SRC" 'net/minecraftforge/client/gui/*' -d /tmp/src2; echo "::group::vanilla overlays"; grep -rh -E "Identifier|CROSSHAIR|crosshair" /tmp/src2 | head -30; echo "::endgroup::"
        d() { echo "::group::$1 ($2)"; javap -p -cp "$JAR" "$1" 2>&1 | grep -i -E "$2" | head -${3:-25}; echo "::endgroup::"; }
        d net.minecraft.client.renderer.SubmitNodeCollector "." 40
        d net.minecraft.client.renderer.state.level.LevelRenderState "outline|Outline" 10
        d net.minecraft.client.ClientClockManager "." 30
        d net.minecraft.world.clock.ClockManager "." 30
        d net.minecraft.client.renderer.ShapeRenderer "." 5
        echo "::group::submitHitOutline code"; javap -p -c -cp "$JAR" net.minecraft.client.renderer.LevelRenderer | grep -A60 "void submitHitOutline" | grep -E "invoke|getstatic" | cut -c1-230 | head -40; echo "::endgroup::"
        echo "::group::setTimeFromServer code"; javap -p -c -cp "$JAR" net.minecraft.client.multiplayer.ClientLevel | grep -A25 "void setTimeFromServer" | grep -E "invoke|getstatic" | cut -c1-230; echo "::endgroup::"
        echo "::group::shape render classes"; unzip -l "$JAR" | grep -i -E "ShapeRenderer|ShapeRender|LevelRenderer|Outline" | head; echo "::endgroup::"
