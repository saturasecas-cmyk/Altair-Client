name: Inspect PvP

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        CJ=$(echo "$JARS" | grep client-extra | head -1)
        unzip -Z1 "$CJ" > /tmp/all.txt
        echo "::group::weather classes"; unzip -Z1 "$CJ" | grep -i -E 'weather|rain' | head -30; echo "::endgroup::"
        echo "::group::weather renderer"; for c in $(unzip -Z1 "$CJ" | grep -E 'renderer/(WeatherEffectRenderer|state/level/WeatherRenderState|.*Weather.*)\.class' | grep -v '\$' | sed 's/\.class//;s|/|.|g' | head -4); do javap -p -cp "$CP" "$c" | cut -c1-240; done; echo "::endgroup::"
        echo "::group::level weather"; javap -p -cp "$CP" net.minecraft.client.multiplayer.ClientLevel | grep -i -E 'rain|thunder|weather' | cut -c1-200; javap -p -cp "$CP" net.minecraft.client.renderer.LevelRenderer | grep -i -E 'weather|rain' | cut -c1-200; echo "::endgroup::"
        echo "::group::particle types"; javap -p -constants -cp "$CP" net.minecraft.core.particles.ParticleTypes | grep -i -E 'rain|splash|dust|end_rod|glow|firework|electric|wax|spark|dripping_obsidian|reverse_portal|happy' | cut -c1-200; echo "::endgroup::"
