name: Inspect API

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JAR=$GITHUB_WORKSPACE/.gradle/mavenizer/repo/net/minecraftforge/forge/26.2-65.1.6/forge-26.2-65.1.6.jar
        mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$JAR" 'net/minecraft/client/*' 'net/minecraftforge/*' || true
        echo "::group::classes referencing BackgroundRendered"
        grep -rl 'ScreenEvent$BackgroundRendered' /tmp/x | head
        echo "::endgroup::"
        for c in net.minecraftforge.client.event.ForgeEventFactoryClient; do
          echo "::group::factory bg"; javap -p -cp "$JAR" $c | grep -i -E 'background|ScreenRender|Render'; echo "::endgroup::"
        done
        for m in 'net.minecraft.client.gui.screens.Screen' 'net.minecraft.client.gui.screens.TitleScreen' 'net.minecraft.client.renderer.Panorama'; do
          echo "::group::CODE $m"; javap -p -c -cp "$JAR" $m | grep -E '^  [a-z].*\(|invoke|getstatic' | grep -i -E 'extractBackground|extractRenderState\(|extractPanorama|Panorama|BackgroundRendered|ForgeEventFactoryClient|nextStratum|blurBefore|extractMenuBackground|^  (public|protected)' | head -80; echo "::endgroup::"
        done
        echo "::group::Pre-event fire sites"
        grep -rl 'onRenderScreenPre\|ScreenEvent$Render$Pre' /tmp/x | head
        echo "::endgroup::"
