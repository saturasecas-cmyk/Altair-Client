name: Inspect API

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JAR=$GITHUB_WORKSPACE/.gradle/mavenizer/repo/net/minecraftforge/forge/26.2-65.1.6/forge-26.2-65.1.6.jar
        dump() { echo "::group::$1"; javap -p -cp "$JAR" "$1" 2>&1 | head -${2:-200}; echo "::endgroup::"; }
        dumpc() { echo "::group::CODE $1"; javap -p -c -constants -cp "$JAR" "$1" 2>&1 | head -${2:-400}; echo "::endgroup::"; }
        dumpc net.minecraft.gizmos.Gizmos 140
        dumpc 'net.minecraft.gizmos.Gizmos$TemporaryCollection' 80
        dump net.minecraft.gizmos.SimpleGizmoCollector 40
        mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$JAR" 'net/minecraft/client/*' || true
        echo "::group::callers collectPerFrameRenderThreadGizmos"
        for f in $(grep -rl 'collectPerFrameRenderThreadGizmos' /tmp/x); do
          c=$(echo "$f" | sed 's#/tmp/x/##; s#\.class$##; s#/#.#g')
          echo "== $c"
          javap -p -c -cp "$JAR" "$c" | grep -n -B25 -A25 'collectPerFrameRenderThreadGizmos' | head -120
        done
        echo "::endgroup::"
        echo "::group::callers DebugRenderer.emitGizmos"
        for f in $(grep -rl 'DebugRenderer.emitGizmos\|emitGizmos' /tmp/x | head -6); do echo "$f"; done
        echo "::endgroup::"
        echo "::group::ClientLevel entities"; javap -p -cp "$JAR" net.minecraft.client.multiplayer.ClientLevel | grep -i -E 'entit|partial'; echo "::endgroup::"
        echo "::group::DeltaTracker"; javap -p -cp "$JAR" net.minecraft.client.DeltaTracker; echo "::endgroup::"
        echo "::group::Options camera"; javap -p -cp "$JAR" net.minecraft.client.Options | grep -i -E 'camera|fov|keyAttack|keyUse'; echo "::endgroup::"
