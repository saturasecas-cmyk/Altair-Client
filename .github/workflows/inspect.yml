name: Inspect Fix2
on:
  push:
    branches: ['inspect/fix2']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons|minecraft|mojang' )
        CP=$(echo "$JARS" | tr '\n' ':')
        echo "::group::classes"
        for j in $JARS; do unzip -l $j 2>/dev/null | awk '{print $4}' | grep -E '\.class$' | grep -E 'net/minecraft/client/(renderer/fog|renderer/.*Fog|gui/Gui|particle/(ParticleEngine|TerrainParticle|CrackParticle|BlockMarker)|renderer/LevelRenderer|Options|OptionInstance)|DestroyBlock|LevelEventHandler|ParticleEngine|FogEnvironment|BlockDestruction|Crumbling' | head -60; done
        echo "::endgroup::"
        d() { echo "::group::$1"; javap -p -cp "$CP" $1 2>&1 | grep -v "lambda\\$" | head -${2:-200}; echo "::endgroup::"; }
        for c in $(cat inspect-classes.txt); do d $c 250; done
