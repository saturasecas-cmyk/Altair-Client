name: Inspect Tab

on:
  push:
    branches: ['inspect/tab-list']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        for c in net.minecraft.client.gui.components.PlayerTabOverlay net.minecraft.client.multiplayer.PlayerInfo; do echo "::group::$c"; javap -p -cp "$CP" $c 2>&1 | cut -c1-230; echo "::endgroup::"; done
        echo "::group::tab code"; javap -p -c -cp "$CP" net.minecraft.client.gui.components.PlayerTabOverlay 2>&1 | grep -E 'getNameForDisplay|decorateName|getTabListDisplayName|^  [a-z].*\(' | head -60 | cut -c1-220; echo "::endgroup::"
