name: Inspect API 3

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        SRC=$(find $GITHUB_WORKSPACE/.gradle -name 'forge-26.2-*-sources.jar' | head -1)
        JAR=$(find $GITHUB_WORKSPACE/.gradle -name 'forge-26.2-*.jar' ! -name '*sources*' | head -1)
        mkdir -p /tmp/src && cd /tmp/src && unzip -q -o "$SRC" 'net/minecraftforge/client/event/*'
        echo "::group::events list"; ls net/minecraftforge/client/event | tr '\n' ' '; echo "::endgroup::"
        d() { echo "::group::$1 ($2)"; javap -p -cp "$JAR" "$1" 2>&1 | grep -i -E "$2" | head -${3:-25}; echo "::endgroup::"; }
        unzip -q -o "$SRC" 'net/minecraftforge/client/gui/*' -d /tmp/src2
        echo "::group::ForgeLayeredDraw methods"; grep -E "^    (public|private|protected)" /tmp/src2/net/minecraftforge/client/gui/overlay/ForgeLayeredDraw.java | grep -v "Identifier [ A-Z_]* =" | cut -c1-200; echo "::endgroup::"
        echo "::group::ForgeLayer"; grep -v -E '^\s*(\*|/\*|//|import|$)' /tmp/src2/net/minecraftforge/client/gui/overlay/ForgeLayer.java | head -30; echo "::endgroup::"
        echo "::group::crosshair usage"; grep -rn -i "crosshair" /tmp/src2 | cut -c1-240 | head; echo "::endgroup::"
        echo "::group::AddGuiOverlayLayersEvent"; grep -E "public|BUS" /tmp/src/net/minecraftforge/client/event/AddGuiOverlayLayersEvent.java | head; echo "::endgroup::"
