name: Inspect PvP

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        CJ=$(echo "$JARS" | grep client-extra | head -1)
        unzip -Z1 "$CJ" > /tmp/all.txt
        echo "::group::listing"; wc -l /tmp/all.txt; grep -v -E '^assets/minecraft/(textures|models|blockstates|items|sounds|lang|font|shaders|particles|atlases|equipment|post_effect|texts|waypoint_style|gpu_warnlist|regional|resourcepacks|cache|dialog)' /tmp/all.txt | head -40; echo "::endgroup::"
        echo "::group::models matching"; grep -E '^assets/minecraft/models/block/[a-z_]*(slab|stairs|button)[a-z_]*\.json$' /tmp/all.txt | grep -E 'oak|^assets/minecraft/models/block/(slab|stairs|inner|outer|button|template)' | head -40; echo "::endgroup::"
        echo "::group::oak models content"; for f in oak_slab oak_slab_top oak_stairs oak_stairs_inner oak_button oak_button_pressed oak_button_inventory; do echo "-- $f"; unzip -p "$CJ" assets/minecraft/models/block/$f.json 2>&1 | head -12; done; echo "::endgroup::"
        echo "::group::blockstate oak_slab + items"; unzip -p "$CJ" assets/minecraft/blockstates/oak_slab.json 2>&1 | head -20; unzip -p "$CJ" assets/minecraft/items/oak_slab.json 2>&1 | head; unzip -p "$CJ" assets/minecraft/items/oak_button.json 2>&1 | head; echo "::endgroup::"
        echo "::group::parents"; for f in slab slab_top stairs inner_stairs button button_pressed button_inventory; do echo "-- $f"; unzip -p "$CJ" assets/minecraft/models/block/$f.json 2>&1 | head -8 | cut -c1-200; done; echo "::endgroup::"
        echo "::group::counts"; for pat in 'textures/block/[a-z_]*_wool\.png' 'textures/block/[a-z_]*_concrete\.png' 'textures/block/[a-z_]*glass\.png' 'textures/block/[a-z_]*_planks\.png' 'textures/block/[a-z_]*_ore\.png' 'textures/block/[a-z_]*terracotta\.png' 'textures/entity/bed/' 'textures/block/[a-z_]*_log(_top)?\.png' 'textures/block/[a-z_]*quartz[a-z_]*\.png' 'textures/block/[a-z_]*bricks\.png' 'textures/block/redstone' 'textures/block/[a-z_]*_leaves\.png' 'textures/block/[a-z_]*_door_(top|bottom)\.png' 'textures/block/[a-z_]*_trapdoor\.png' 'textures/block/(repeater|comparator)'; do echo "== $pat"; grep -E "^assets/minecraft/$pat" /tmp/all.txt | sed 's|assets/minecraft/textures/||' | tr '\n' ' ' | cut -c1-900; echo; done; echo "::endgroup::"
        echo "::group::packversion api"; javap -p -cp "$CP" net.minecraft.SharedConstants net.minecraft.WorldVersion 2>&1 | grep -i -E 'pack|getCurrentVersion'; javap -p -cp "$CP" net.minecraft.server.packs.PackLocationInfo net.minecraft.server.packs.PackSelectionConfig net.minecraft.server.packs.repository.PackSource 2>&1 | grep -E 'public' | cut -c1-200; javap -p -cp "$CP" 'net.minecraft.server.packs.repository.Pack$ResourcesSupplier' 'net.minecraft.server.packs.repository.Pack$Position' | head -20; javap -p -cp "$CP" net.minecraft.server.packs.PathPackResources | grep public; echo "::endgroup::"
