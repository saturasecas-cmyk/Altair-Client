name: Inspect PvP

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        CJ=$(echo "$JARS" | grep client-extra | head -1)
        unzip -Z1 "$CJ" > /tmp/all.txt
        FJ=$(echo "$JARS" | grep -E 'forge-26.2' | head -1)
        echo "::group::options"; javap -p -cp "$CP" net.minecraft.client.Options | grep -E 'public net.minecraft.client.OptionInstance' | cut -c1-230; echo "::endgroup::"
        echo "::group::enums"; javap -p -cp "$CP" net.minecraft.client.CloudStatus net.minecraft.client.ParticleStatus net.minecraft.client.GraphicsStatus 2>&1 | grep -E 'static final|class|enum' | cut -c1-200; echo "::endgroup::"
        echo "::group::entity events"; unzip -Z1 "$FJ" | grep -E 'client/event/(Render|Entity)' | grep -v '\$' | head -40; echo "::endgroup::"
        echo "::group::renderlivingevent"; for c in $(unzip -Z1 "$FJ" | grep -E 'client/event/(RenderLivingEvent|RenderNameTagEvent|RenderLevelStageEvent)' | sed 's/\.class//;s|/|.|g' | head -12); do echo "## $c"; javap -p -cp "$CP" "$c" | grep -E 'public' | cut -c1-200; done; echo "::endgroup::"
        echo "::group::entity dispatcher"; javap -p -cp "$CP" net.minecraft.client.renderer.entity.EntityRenderDispatcher | grep -E 'shouldRender|extractEntity|distanceToSqr|submit' | cut -c1-240; javap -p -cp "$CP" net.minecraft.client.renderer.LevelRenderer | grep -E 'shouldRender|extractVisibleEntities|isEntityVisible|cull|Visible' | cut -c1-240; javap -p -cp "$CP" net.minecraft.client.renderer.entity.EntityRenderer | grep -E 'shouldRender' | cut -c1-240; echo "::endgroup::"
