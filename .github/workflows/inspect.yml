name: Inspect API

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Build (downloads deps)
      run: ./gradlew build --no-daemon || true
    - name: Locate jars
      run: |
        MC=""; FG=""
        for j in $(find ~/.gradle . /home/runner -name '*.jar' -size +1M 2>/dev/null | sort -u); do
          if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then echo "MC: $j"; MC="$MC:$j"; fi
          if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraftforge/client/event/InputEvent.class'; then echo "FORGE: $j"; MC="$MC:$j"; fi
        done
        echo "CP=$MC" > /tmp/cp.env
        cat /tmp/cp.env
    - name: javap signatures
      run: |
        source /tmp/cp.env
        CPATH="${CP#:}"
        dump() { echo "::group::$1"; javap -p -cp "$CPATH" "$1" 2>&1 | head -${2:-200}; echo "::endgroup::"; }
        dump net.minecraft.client.Minecraft 400
        dump net.minecraft.client.gui.Gui 200
        dump net.minecraft.client.KeyboardHandler 120
        dump net.minecraft.client.MouseHandler 120
        dump net.minecraft.client.Camera 120
        dump net.minecraft.client.renderer.GameRenderer 200
        dump net.minecraft.client.renderer.entity.EntityRenderDispatcher 120
        dump net.minecraft.client.renderer.entity.state.EntityRenderState 80
        dump net.minecraft.client.renderer.entity.state.HitboxRenderState 40
        dump net.minecraft.client.renderer.entity.state.HitboxesRenderState 40
        dump 'net.minecraftforge.client.event.ViewportEvent$ComputeFov' 40
        dump 'net.minecraftforge.client.event.InputEvent$MouseButton' 40
        dump 'net.minecraftforge.client.event.InputEvent$MouseButton$Pre' 40
        dump net.minecraftforge.client.event.RenderLevelStageEvent 80
        echo "::group::hitbox/debug classes in MC jar"
        for j in $(echo "$CPATH" | tr ':' ' '); do unzip -l "$j" | grep -i -E 'hitbox|DebugScreen|LevelRenderState|ShapeRenderer|RenderTypes' | head -60; done
        echo "::endgroup::"
