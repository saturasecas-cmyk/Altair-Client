name: Inspect Forge API (temporal)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - uses: gradle/actions/setup-gradle@v4

    - name: Print compile classpath
      run: |
        cat > /tmp/cp.init.gradle <<'EOF'
        allprojects {
          afterEvaluate {
            tasks.register('printCp') {
              doLast {
                configurations.compileClasspath.files.each { println "CP:" + it }
              }
            }
          }
        }
        EOF
        ./gradlew --init-script /tmp/cp.init.gradle printCp -q --no-daemon 2>&1 | grep '^CP:' | sed 's/^CP://' > /tmp/cp.txt || true
        wc -l /tmp/cp.txt
        cat /tmp/cp.txt

    - name: Inspect APIs
      run: |
        CP=$(paste -sd: /tmp/cp.txt)
        for c in \
          net.minecraftforge.client.event.AddGuiOverlayLayersEvent \
          net.minecraftforge.client.gui.overlay.ForgeLayer \
          net.minecraftforge.client.gui.overlay.ForgeLayeredDraw \
          net.minecraftforge.client.gui.overlay.ForgeLayerInstance \
          'net.minecraftforge.client.gui.overlay.ForgeLayeredDraw$LayerOffset' \
          'net.minecraftforge.client.event.ViewportEvent$ComputeFov' \
          'net.minecraftforge.client.event.InputEvent$MouseButton$Pre' \
          net.minecraft.client.MouseHandler \
          net.minecraft.client.input.MouseButtonInfo \
          net.minecraft.client.gui.GuiGraphicsExtractor ; do
          echo "=== $c ==="
          javap -p -cp "$CP" "$c" 2>&1 | head -80
        done
        echo "=== Camera (fov) ==="
        javap -p -cp "$CP" net.minecraft.client.Camera | grep -iE "fov|class" || true
        echo "=== GameRenderer (fov) ==="
        javap -p -cp "$CP" net.minecraft.client.renderer.GameRenderer | grep -iE "fov" || true
        echo "=== Hud (public methods) ==="
        javap -p -cp "$CP" net.minecraft.client.gui.Hud | grep -E "public|class" | head -40 || true
        echo "=== LayeredDraw ==="
        javap -p -cp "$CP" net.minecraft.client.gui.LayeredDraw 2>&1 | head -30 || true
