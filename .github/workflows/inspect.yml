name: Inspect PvP

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        CJ=$(echo "$JARS" | grep client-extra | head -1)
        unzip -Z1 "$CJ" > /tmp/all.txt
        echo "::group::camera"; javap -p -cp "$CP" net.minecraft.client.Camera | cut -c1-240; echo "::endgroup::"
        echo "::group::camera code"; javap -p -c -cp "$CP" net.minecraft.client.Camera | awk '/public void (setup|update)\(/{f=1} f' | grep -E 'public|invoke|getstatic|ComputeCameraAngles|Event' | head -120 | cut -c1-230; echo "::endgroup::"
        echo "::group::mouse"; javap -p -cp "$CP" net.minecraft.client.MouseHandler | grep -i -E 'turn|accumul|handle' | cut -c1-200; javap -p -c -cp "$CP" net.minecraft.client.MouseHandler | awk '/void turnPlayer/{f=1} f' | grep -E 'invoke|void' | head -25 | cut -c1-220; echo "::endgroup::"
        echo "::group::entity rot"; javap -p -cp "$CP" net.minecraft.world.entity.Entity | grep -E 'Rot|turn' | cut -c1-200; echo "::endgroup::"
        echo "::group::cameraentity"; javap -p -cp "$CP" net.minecraft.client.Minecraft | grep -i -E 'cameraEntity|getCameraEntity|setCameraEntity' | cut -c1-200; javap -p -cp "$CP" net.minecraft.client.renderer.GameRenderer | grep -i -E 'camera|mainCamera|getMainCamera' | cut -c1-200; echo "::endgroup::"
