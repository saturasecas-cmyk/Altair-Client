name: Inspect API

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JAR=./.gradle/mavenizer/repo/net/minecraftforge/forge/26.2-65.1.6/forge-26.2-65.1.6.jar
        ls -la "$JAR"
        dump() { echo "::group::$1"; javap -p -cp "$JAR" "$1" 2>&1 | head -${2:-200}; echo "::endgroup::"; }
        dumpc() { echo "::group::CODE $1"; javap -p -c -constants -cp "$JAR" "$1" 2>&1 | head -${2:-400}; echo "::endgroup::"; }
        dump net.minecraft.client.gui.components.debug.DebugScreenEntryList 120
        dump net.minecraft.client.gui.components.debug.DebugScreenEntries 150
        dump net.minecraft.client.gui.components.debug.DebugScreenEntryStatus 40
        dump net.minecraft.client.renderer.state.level.LevelRenderState 60
        dump net.minecraft.client.renderer.debug.EntityHitboxDebugRenderer 60
        dumpc net.minecraft.client.renderer.debug.EntityHitboxDebugRenderer 500
        mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$GITHUB_WORKSPACE/$JAR" 'net/minecraft/client/*' 'net/minecraftforge/client/*' || true
        echo "::group::files referencing HitboxRenderState"
        grep -rl 'HitboxRenderState' /tmp/x | head -20
        echo "::endgroup::"
        echo "::group::files referencing ENTITY_HITBOXES"
        grep -rl 'ENTITY_HITBOXES' /tmp/x | head -20
        echo "::endgroup::"
        echo "::group::ForgeEvents list (client event)"
        unzip -l "$GITHUB_WORKSPACE/$JAR" | grep -E 'net/minecraftforge/client/event/[A-Za-z]*Render[A-Za-z]*\.class' | head -40
        echo "::endgroup::"
