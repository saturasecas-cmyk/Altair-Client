name: Inspect Hacks
on:
  push:
    branches: ['inspect/hacks']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons|minecraft|mojang' )
        CP=$(echo "$JARS" | tr '\n' ':')
        echo "::group::classes"
        for j in $JARS; do unzip -l $j 2>/dev/null | awk '{print $4}' | grep -E '\.class$' | grep -E 'renderer/fog/|Tags\.class|ItemTags|BlockTags|world/item/BlockItem|CropBlock.class' | head -30; done | sort -u
        echo "::endgroup::"
        d() { echo "::group::$1"; javap -p -cp "$CP" $1 2>&1 | grep -E "$2" || true; echo "::endgroup::"; }
        d2() { echo "::group::$1"; javap -p -s -cp "$CP" $1 2>&1 | grep -A1 -E "$2" || true; echo "::endgroup::"; }
        d net.minecraft.client.renderer.LevelRenderer 'public ' || true
        d net.minecraft.client.Minecraft 'levelRenderer|reloadResourcePacks|lazyReload' || true
