name: Inspect Forge API (temporal)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - uses: gradle/actions/setup-gradle@v4

    - name: Print compile classpath
      run: |
        cat > /tmp/cp.init.gradle <<'EOF'
        allprojects {
          afterEvaluate {
            tasks.register('printCp') {
              doLast {
                configurations.compileClasspath.files.each { println "CP:" + it }
              }
            }
          }
        }
        EOF
        ./gradlew --init-script /tmp/cp.init.gradle printCp -q --no-daemon 2>&1 | grep '^CP:' | sed 's/^CP://' > /tmp/cp.txt || true
        wc -l /tmp/cp.txt
        cat /tmp/cp.txt

    - name: Inspect APIs
      run: |
        CP=$(paste -sd: /tmp/cp.txt)
        echo "=== Options (hide) ==="
        javap -p -cp "$CP" net.minecraft.client.Options | grep -iE "hide|gui" || true
        echo "=== Hud (hide/visible) ==="
        javap -p -cp "$CP" net.minecraft.client.gui.Hud | grep -iE "hide|visible|isHidden" || true
        echo "=== Minecraft (hide) ==="
        javap -p -cp "$CP" net.minecraft.client.Minecraft | grep -iE "hide|hudHidden" || true
