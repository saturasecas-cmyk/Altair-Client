name: Inspect PvP

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        CJ=$(echo "$JARS" | grep client-extra | head -1)
        unzip -Z1 "$CJ" > /tmp/all.txt
        FJ=$(echo "$JARS" | grep -E 'forge-26.2' | head -1)
        echo "::group::forge events"; unzip -Z1 "$FJ" 2>/dev/null | grep -E 'net/minecraftforge/client/(event|gui)/' | grep -i -E 'nametag|ScreenEvent|RenderGui|ForgeLayeredDraw|Layer|Tooltip|Chat' | head -60; echo "::endgroup::"
        echo "::group::forge layered"; javap -p -cp "$CP" net.minecraftforge.client.gui.overlay.ForgeLayeredDraw 2>&1 | head -50; echo "::endgroup::"
        echo "::group::nametag"; for c in $(unzip -Z1 "$FJ" | grep -E 'RenderNameTagEvent' | sed 's/\.class//;s|/|.|g' | tr '\n' ' '); do javap -p -cp "$CP" "$c" | grep -E 'public|class'; done; echo "::endgroup::"
        echo "::group::screen events"; for c in $(unzip -Z1 "$FJ" | grep -E 'client/event/ScreenEvent' | sed 's/\.class//;s|/|.|g' | tr '\n' ' '); do javap -p -cp "$CP" "$c" | grep -E 'public|class'; done; echo "::endgroup::"
        echo "::group::options"; javap -p -cp "$CP" net.minecraft.client.Options | grep -i -E 'textBackground|chat|keyPlayerList|blur|menuBackground|accessibility|hideGui|screenEffect' | cut -c1-200; echo "::endgroup::"
        echo "::group::tab"; javap -p -cp "$CP" net.minecraft.client.multiplayer.ClientPacketListener | grep -i -E 'getOnlinePlayers|getListedOnlinePlayers'; javap -p -cp "$CP" net.minecraft.client.multiplayer.PlayerInfo | grep -E 'getProfile|getTabListDisplayName|getLatency|getGameMode'; javap -p -cp "$CP" net.minecraft.client.gui.Gui | grep -i -E 'hud|tab|chat' | cut -c1-200; echo "::endgroup::"
        echo "::group::guigraphics"; javap -p -cp "$CP" net.minecraft.client.gui.GuiGraphicsExtractor | grep -E ' (fill|text|centeredText|fillGradient|textWithBackdrop|enableScissor|pose)\(' | cut -c1-200; echo "::endgroup::"
        echo "::group::armor/vanilla layers"; javap -p -cp "$CP" net.minecraftforge.client.gui.overlay.ForgeLayeredDraw | grep -E 'static final' ; echo "::endgroup::"
