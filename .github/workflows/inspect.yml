name: Inspect Events

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JAR=$(find $GITHUB_WORKSPACE/.gradle -name 'forge-26.2-*-sources.jar' | head -1)
        mkdir -p /tmp/src && cd /tmp/src && unzip -q -o "$JAR" 'net/minecraftforge/client/event/*'
        for c in RenderNameTagEvent ClientChatReceivedEvent SystemMessageReceivedEvent RenderAvatarEvent RenderLivingEvent RenderHandEvent RenderItemInFrameEvent; do
          echo "::group::$c"; grep -v -E '^\s*(\*|/\*|//|import|$)' net/minecraftforge/client/event/$c.java | head -90; echo "::endgroup::"
        done
