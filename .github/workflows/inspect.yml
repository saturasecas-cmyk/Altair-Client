name: Inspect Blur

on:
  push:
    branches: ['inspect/blur']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        echo "::group::Screen"; javap -p -cp "$CP" net.minecraft.client.gui.screens.Screen 2>&1 | grep -iE "blur|background|isInGameUi|extractRenderState|extractMenuBackground|BLUR" | cut -c1-230; echo "::endgroup::"
        echo "::group::Extractor"; javap -p -cp "$CP" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | grep -iE "blur|stratum" | cut -c1-230; echo "::endgroup::"
        echo "::group::Screen code"; javap -p -c -cp "$CP" net.minecraft.client.gui.screens.Screen 2>&1 | grep -A40 "void extractBackground" | grep -E "invoke|getfield|ifn|ifeq" | cut -c1-220 | head -30; echo "::endgroup::"
