name: Inspect API

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JAR=./.gradle/mavenizer/repo/net/minecraftforge/forge/26.2-65.1.6/forge-26.2-65.1.6.jar
        dump() { echo "::group::$1"; javap -p -cp "$JAR" "$1" 2>&1 | head -${2:-200}; echo "::endgroup::"; }
        dumpc() { echo "::group::CODE $1"; javap -p -c -constants -cp "$JAR" "$1" 2>&1 | head -${2:-400}; echo "::endgroup::"; }
        echo "::group::gizmo classes"; unzip -l "$JAR" | grep -E 'net/minecraft/gizmos/' | awk '{print $4}'; echo "::endgroup::"
        dump net.minecraft.client.renderer.debug.DebugRenderer 150
        dump 'net.minecraft.client.renderer.debug.DebugRenderer$SimpleDebugRenderer' 20
        dumpc net.minecraft.client.renderer.debug.DebugRenderer 450
        dump net.minecraft.gizmos.Gizmos 80
        dump net.minecraft.gizmos.GizmoStyle 40
        dump net.minecraft.gizmos.GizmoProperties 40
        dump net.minecraft.gizmos.GizmoCollector 40
        echo "::group::KeyboardHandler ENTITY_HITBOXES ctx"
        javap -p -c -constants -cp "$JAR" net.minecraft.client.KeyboardHandler | grep -n -B8 -A10 'ENTITY_HITBOXES' | head -60
        echo "::endgroup::"
        echo "::group::LevelRenderer gizmo/debug refs"
        javap -p -c -constants -cp "$JAR" net.minecraft.client.renderer.LevelRenderer | grep -n -E 'emitGizmos|withCollector|Gizmo|DebugRenderer|^  [a-z].*\(' | grep -n -i -E 'emitGizmos|withCollector|Gizmo|DebugRenderer' | head -40
        echo "::endgroup::"
        dump net.minecraft.client.renderer.LevelRenderer 120
