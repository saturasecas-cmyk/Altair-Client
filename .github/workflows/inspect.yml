name: Inspect PvP

on:
  push:
    branches: ['inspect/**']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Resolve deps
      run: ./gradlew compileJava --no-daemon || true
    - name: Dump
      run: |
        JARS=$(find $GITHUB_WORKSPACE/.gradle ~/.gradle -name '*.jar' ! -name '*sources*' 2>/dev/null | grep -E 'client-extra|forge-26.2|fastutil|joml|slf4j|asm|datafixer|brigadier|guava|gson|lwjgl|netty|commons' )
        CP=$(echo "$JARS" | tr '\n' ':')
        CJ=$(echo "$JARS" | grep client-extra | head -1)
        unzip -Z1 "$CJ" > /tmp/all.txt
        echo "::group::logo"; javap -p -cp "$CP" net.minecraft.client.gui.components.LogoRenderer 2>&1 | cut -c1-260; echo "::endgroup::"
        echo "::group::title"; javap -p -c -cp "$CP" net.minecraft.client.gui.screens.TitleScreen 2>&1 | grep -E 'LogoRenderer|logo|Logo' | cut -c1-240; javap -p -cp "$CP" net.minecraft.client.gui.screens.TitleScreen | cut -c1-240; echo "::endgroup::"
        echo "::group::blit"; javap -p -cp "$CP" net.minecraft.client.gui.GuiGraphicsExtractor | grep -E ' (blit|blitSprite|innerBlit)\(' | cut -c1-300; echo "::endgroup::"
        echo "::group::consts"; javap -p -constants -cp "$CP" net.minecraft.client.gui.components.LogoRenderer | grep -E 'static final' | cut -c1-240; echo "::endgroup::"
        echo "::group::pipelines"; javap -p -cp "$CP" net.minecraft.client.renderer.RenderPipelines | grep -i -E 'GUI_TEXTURED' | cut -c1-200; echo "::endgroup::"
