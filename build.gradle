plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // Minecraft 26.x no está ofuscado, así que no hacen falta mappings.
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // Solo para compilar los mixins; Forge ya incluye Mixin en tiempo de ejecución.
    compileOnly 'org.spongepowered:mixin:0.8.7'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
