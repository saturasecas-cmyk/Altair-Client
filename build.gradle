plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'com.altairclient'
version = '1.0.0'

java {
    archivesBaseName = 'altairclient'
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

minecraft {
    mappings channel: 'official', version: '26.2'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'DEBUG'
            mods {
                altairclient {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "altairclient.refmap.json"
    config "altairclient.mixins.json"
}

dependencies {
    minecraft 'net.minecraftforge:forge:26.2-65.1.6'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-forge:0.4.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
