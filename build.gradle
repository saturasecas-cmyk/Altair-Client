plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'com.altairclient'
version = '0.1.10'

java {
    archivesBaseName = 'altairclient'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.4' // Ajusta según la versión de tu MDK
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'DEBUG'
            mods {
                altairclient {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'DEBUG'
            mods {
                altairclient {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "altairclient.refmap.json"
    config "altairclient.mixins.json"
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.4-49.0.3' // Cambia por tu versión exacta de Forge
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
